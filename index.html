<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Songleaf</title>
<meta name="description" content="Store your lyrics and scan printed or handwritten lyric sheets.">
<meta name="theme-color" content="#5C1A1B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songleaf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --ink: #2B1B12;
    --ink-soft: #6B5A47;
    --paper: #F4EEDF;
    --paper-2: #EAE1C8;
    --paper-edge: #D9CBA3;
    --maroon: #5C1A1B;
    --maroon-deep: #401212;
    --gold: #B4872F;
    --gold-bright: #D4A537;
    --bg: #EDE4CD;
    --danger: #8A2E1F;
    --shadow: rgba(43,27,18,0.16);
    --serif: 'Lora', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink: #EFE6D2;
      --ink-soft: #B9AB90;
      --paper: #2A2019;
      --paper-2: #362A20;
      --paper-edge: #4A3A2A;
      --maroon: #A3423F;
      --maroon-deep: #7A2F2C;
      --gold: #D9B24C;
      --gold-bright: #E7C568;
      --bg: #1B140F;
      --danger: #D06B54;
      --shadow: rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --ink: #EFE6D2;
    --ink-soft: #B9AB90;
    --paper: #2A2019;
    --paper-2: #362A20;
    --paper-edge: #4A3A2A;
    --maroon: #A3423F;
    --maroon-deep: #7A2F2C;
    --gold: #D9B24C;
    --gold-bright: #E7C568;
    --bg: #1B140F;
    --danger: #D06B54;
    --shadow: rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
  }

  /* ---------- Header ---------- */
  .app-header{
    background: linear-gradient(180deg, var(--maroon) 0%, var(--maroon-deep) 100%);
    color: #F4EEDF;
    padding: 22px 20px 18px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .app-header .mark{
    display:flex;
    align-items: baseline;
    gap: 10px;
  }
  .app-header h1{
    font-family: var(--serif);
    font-weight: 700;
    font-size: 26px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .app-header .tagline{
    font-size: 12.5px;
    color: rgba(244,238,223,0.72);
    margin-top: 3px;
    font-style: italic;
    font-family: var(--serif);
  }

  /* ---------- Main scroll area ---------- */
  .view{
    flex: 1;
    padding: 16px 16px 100px;
    overflow-y: auto;
  }
  .view.hidden{ display:none; }

  /* ---------- Search + new bar ---------- */
  .toolbar{
    display:flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .search-wrap{
    flex:1;
    position: relative;
  }
  .search-wrap svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; opacity:0.55;
  }
  .search-wrap input{
    width:100%;
    padding: 10px 12px 10px 34px;
    border-radius: 10px;
    border: 1px solid var(--paper-edge);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14.5px;
  }
  .search-wrap input:focus{ outline: 2px solid var(--gold); outline-offset: 1px; }
  .btn-new{
    background: var(--maroon);
    color: #F4EEDF;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-new:active{ transform: translateY(1px); }

  /* ---------- Library list ---------- */
  .lyric-card{
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    position: relative;
    transition: box-shadow .15s ease;
  }
  .lyric-card:active{ box-shadow: inset 0 1px 6px var(--shadow); }
  .lyric-card .row-top{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .lyric-card h3{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    margin: 0;
    color: var(--ink);
  }
  .lyric-card .tag{
    font-size: 11px;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 20px;
    padding: 1px 8px;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: var(--sans);
  }
  .lyric-card .artist{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .lyric-card .snippet{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 8px;
    font-family: var(--serif);
    font-style: italic;
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .empty-state{
    text-align: center;
    padding: 60px 24px 20px;
    color: var(--ink-soft);
  }
  .empty-state .icon{ font-size: 38px; margin-bottom: 10px; }
  .empty-state h3{
    font-family: var(--serif);
    color: var(--ink);
    font-size: 19px;
    margin: 0 0 6px;
  }
  .empty-state p{ font-size: 13.5px; line-height: 1.5; margin: 0 0 18px; }
  .empty-state .btn-new{ padding: 10px 18px; }

  /* ---------- Scan view ---------- */
  .scan-drop{
    border: 1.5px dashed var(--paper-edge);
    border-radius: 14px;
    padding: 34px 20px;
    text-align: center;
    background: var(--paper);
    color: var(--ink-soft);
    position: relative;
  }
  .scan-drop .icon{ font-size: 34px; margin-bottom: 8px; }
  .scan-drop h3{
    font-family: var(--serif);
    color: var(--ink);
    font-size: 17px;
    margin: 0 0 4px;
  }
  .scan-drop p{ font-size: 13px; margin: 0 0 16px; line-height:1.5; }
  .scan-buttons{ display:flex; gap:10px; justify-content:center; flex-wrap: wrap; }
  .scan-buttons label{
    background: var(--maroon);
    color: #F4EEDF;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    display:inline-block;
  }
  .scan-buttons label.secondary{
    background: transparent;
    border: 1px solid var(--maroon);
    color: var(--maroon);
  }
  input[type=file]{ display:none; }

  .scan-preview{ margin-top: 16px; }
  .scan-preview img{
    width:100%;
    border-radius: 12px;
    border: 1px solid var(--paper-edge);
    display:block;
  }
  .scan-progress{
    margin-top: 14px;
    background: var(--paper-2);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
  }
  .scan-progress-bar{
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    width: 0%;
    transition: width .25s ease;
  }
  .scan-progress-bar.indeterminate{
    width: 40% !important;
    animation: scan-indeterminate 1.3s ease-in-out infinite;
  }
  @keyframes scan-indeterminate{
    0%   { margin-left: -40%; }
    100% { margin-left: 100%; }
  }
  .scan-status{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 8px;
    text-align: center;
  }
  .scan-error{
    margin-top: 14px;
    background: rgba(138,46,31,0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }

  .field{ margin-top: 16px; }
  .field label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input[type=text], .field select, .field textarea{
    width:100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--paper-edge);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14.5px;
  }
  .field textarea{
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.55;
    resize: vertical;
    min-height: 160px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline: 2px solid var(--gold); outline-offset: 1px;
  }

  /* ---------- Tab bar ---------- */
  .tabbar{
    position: sticky;
    bottom: 0;
    display:flex;
    background: var(--paper);
    border-top: 1px solid var(--paper-edge);
    box-shadow: 0 -2px 10px var(--shadow);
    z-index: 20;
  }
  .tabbar button{
    flex:1;
    background: none;
    border: none;
    padding: 10px 0 8px;
    display:flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .tabbar button svg{ width: 21px; height: 21px; }
  .tabbar button.active{ color: var(--maroon); }
  .tabbar button.active svg{ stroke: currentColor; }
  :root[data-theme="dark"] .tabbar button.active{ color: var(--gold-bright); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tabbar button.active{ color: var(--gold-bright); }
  }

  /* ---------- Editor overlay ---------- */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display:flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .overlay.hidden{ display:none; }
  .sheet{
    background: var(--bg);
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    border-radius: 18px 18px 0 0;
    display:flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet-header{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--paper-edge);
    background: var(--paper);
  }
  .sheet-header h2{
    font-family: var(--serif);
    font-size: 18px;
    margin:0;
  }
  .sheet-header button{
    background:none; border:none; font-size: 15px; color: var(--ink-soft);
    cursor:pointer; padding: 4px 6px; font-family: var(--sans); font-weight:600;
  }
  .sheet-body{
    padding: 6px 18px 18px;
    overflow-y: auto;
  }
  .sheet-footer{
    padding: 14px 18px;
    border-top: 1px solid var(--paper-edge);
    background: var(--paper);
    display:flex;
    gap: 10px;
  }
  .btn-primary{
    flex:1;
    background: var(--maroon);
    color:#F4EEDF;
    border:none;
    border-radius: 10px;
    padding: 12px 0;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    font-family: var(--sans);
  }
  .btn-delete{
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 10px;
    padding: 12px 16px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family: var(--sans);
  }

  /* ---------- Lyric viewer (read-only, formatted) ---------- */
  .viewer-heading h2{
    font-family: var(--serif);
    font-size: 19px;
    margin: 0;
  }
  .viewer-meta{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 3px;
  }
  .lyric-line-chord{
    font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: calc(12.5px * var(--vz, 1));
    color: var(--gold);
    white-space: pre;
    overflow-x: auto;
    line-height: 1.3;
  }
  :root[data-theme="dark"] .lyric-line-chord{ color: var(--gold-bright); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .lyric-line-chord{ color: var(--gold-bright); }
  }
  .lyric-line-meta{
    font-family: var(--sans);
    font-size: calc(12.5px * var(--vz, 1));
    color: var(--ink-soft);
    font-style: italic;
    line-height: 1.5;
  }
  .lyric-line-section{
    font-family: var(--sans);
    font-weight: 700;
    font-size: calc(12.5px * var(--vz, 1));
    color: var(--maroon);
    margin-top: 16px;
    margin-bottom: 2px;
  }
  :root[data-theme="dark"] .lyric-line-section{ color: var(--gold-bright); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .lyric-line-section{ color: var(--gold-bright); }
  }
  .lyric-line-lyric{
    font-family: var(--serif);
    font-size: calc(19px * var(--vz, 1));
    font-weight: 500;
    line-height: 1.55;
    color: var(--ink);
  }
  .lyric-line-blank{ height: calc(12px * var(--vz, 1)); }
  .lyric-empty{
    color: var(--ink-soft);
    font-size: 13.5px;
    font-style: italic;
    padding: 20px 0;
    text-align: center;
  }
  #viewer-body{
    touch-action: pan-y;
  }
  .viewer-zoom-bar{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--paper-edge);
  }
  .viewer-zoom-btn{
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--paper-edge);
    background: transparent;
    color: var(--ink);
    font-size: 17px;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .viewer-zoom-label{
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink-soft);
    min-width: 42px;
    text-align: center;
  }
  .viewer-zoom-reset{
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    margin-left: auto;
  }

  .toast{
    position: fixed;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--bg);
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-family: var(--sans);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 60;
    max-width: 90%;
    text-align: center;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  ::selection{ background: var(--gold); color: var(--maroon-deep); }

  /* ---------- Import banner ---------- */
  .import-banner{
    background: var(--paper-2);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display:flex;
    align-items: center;
    gap: 12px;
  }
  .import-banner .icon{ font-size: 22px; flex-shrink:0; }
  .import-banner .text{ flex:1; }
  .import-banner .text h4{
    font-family: var(--serif);
    margin: 0 0 2px;
    font-size: 14.5px;
    color: var(--ink);
  }
  .import-banner .text p{
    margin: 0;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .import-banner .actions{ display:flex; flex-direction:column; gap:6px; }
  .import-banner button{
    border: none;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .import-banner .btn-import-yes{ background: var(--maroon); color: #F4EEDF; }
  .import-banner .btn-import-no{ background: transparent; color: var(--ink-soft); }
  .import-banner.hidden{ display:none; }
</style>
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="mark">
      <h1>Songleaf</h1>
    </div>
    <div class="tagline">Your lyrics, always on hand</div>
  </header>

  <!-- LIBRARY VIEW -->
  <div class="view" id="view-library">
    <div class="import-banner hidden" id="import-banner">
      <div class="icon">📖</div>
      <div class="text">
        <h4 id="import-banner-title">Add included songs?</h4>
        <p id="import-banner-desc">Some songs are ready to import.</p>
      </div>
      <div class="actions">
        <button class="btn-import-yes" id="btn-import-yes">Import all</button>
        <button class="btn-import-no" id="btn-import-no">Not now</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Search title, artist, lyrics…" />
      </div>
      <button class="btn-new" id="btn-add-new">+ New</button>
    </div>
    <div id="library-list"></div>
  </div>

  <!-- SCAN VIEW -->
  <div class="view hidden" id="view-scan">
    <div class="scan-drop" id="scan-drop">
      <div class="icon">📷</div>
      <h3>Scan a page</h3>
      <p>Photograph or upload a lyric sheet and Songleaf will pull out the text.</p>
      <div class="scan-buttons">
        <label class="primary">Take photo
          <input type="file" accept="image/*" capture="environment" id="file-camera">
        </label>
        <label class="secondary">Upload image
          <input type="file" accept="image/*" id="file-upload">
        </label>
      </div>
    </div>

    <div id="scan-preview-wrap" style="display:none;">
      <div class="scan-preview">
        <img id="scan-preview-img" alt="Scanned page preview">
      </div>
      <div id="scan-progress-wrap" style="display:none;">
        <div class="scan-progress"><div class="scan-progress-bar" id="scan-progress-bar"></div></div>
        <div class="scan-status" id="scan-status">Reading the page…</div>
      </div>
      <div id="scan-error" class="scan-error" style="display:none;"></div>

      <div id="scan-result" style="display:none;">
        <div class="field">
          <label for="scan-title">Title</label>
          <input type="text" id="scan-title" placeholder="Song title">
        </div>
        <div class="field">
          <label for="scan-artist">Artist / key (optional)</label>
          <input type="text" id="scan-artist" placeholder="e.g. Key of G">
        </div>
        <div class="field">
          <label for="scan-text">Extracted text</label>
          <textarea id="scan-text" placeholder="Extracted lyrics will appear here — feel free to fix anything OCR missed."></textarea>
        </div>
        <div class="field" style="display:flex; gap:10px;">
          <button class="btn-primary" id="btn-save-scan">Save to library</button>
          <button class="btn-delete" id="btn-discard-scan">Discard</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB BAR -->
  <nav class="tabbar">
    <button class="active" id="tab-library" data-tab="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Library
    </button>
    <button id="tab-scan" data-tab="scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Scan
    </button>
  </nav>

  <!-- VIEWER OVERLAY (read-only, formatted lyrics) -->
  <div class="overlay hidden" id="viewer-overlay">
    <div class="sheet">
      <div class="sheet-header">
        <div class="viewer-heading">
          <h2 id="viewer-title">Song title</h2>
          <div class="viewer-meta" id="viewer-meta"></div>
        </div>
        <button id="viewer-close">Close</button>
      </div>
      <div class="viewer-zoom-bar">
        <button class="viewer-zoom-btn" id="viewer-zoom-out" aria-label="Zoom out">&minus;</button>

  <!-- EDITOR OVERLAY -->

<script>
(function(){
  "use strict";

  // ---------------- State ----------------
  var lyrics = [];               // {id, title, artist, tag, lyrics, createdAt}
  var currentTab = 'library';
  var editingId = null;          // null = new lyric
  var LOCAL_KEY = 'songleaf_lyrics_v1';
  var titleMigrationDone = false;

  function migrateNumberedTitles(){
    var pattern = /^\d+\.\s*/;
    lyrics.forEach(function(l){
      if (pattern.test(l.title || '')){
        var cleanTitle = l.title.replace(pattern, '').trim();
        saveLyricRecord({ title: cleanTitle, artist: l.artist, tag: l.tag, lyrics: l.lyrics }, l.id);
      }
    });
  }

  // ---------------- Storage (local to this device) ----------------
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      lyrics = raw ? JSON.parse(raw) : [];
    }catch(e){ lyrics = []; }
    sortLyrics();
    if (!titleMigrationDone){
      titleMigrationDone = true;
      migrateNumberedTitles();
    }
    renderLibrary();
  }
  function persistLocal(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(lyrics)); }catch(e){}
  }
  function sortLyrics(){
    lyrics.sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
  }

  function initStorage(){
    loadLocal();
  }

  function saveLyricRecord(record, id){
    // record: {title, artist, tag, lyrics}. Returns a Promise.
    var now = Date.now();
    if (id){
      var idx = lyrics.findIndex(function(l){ return l.id === id; });
      if (idx > -1){
        lyrics[idx].title = record.title;
        lyrics[idx].artist = record.artist;
        lyrics[idx].tag = record.tag;
        lyrics[idx].lyrics = record.lyrics;
      }
    } else {
      lyrics.unshift({
        id: 'l' + now + Math.random().toString(36).slice(2,8) + Math.random().toString(36).slice(2,6),
        title: record.title, artist: record.artist, tag: record.tag,
        lyrics: record.lyrics, createdAt: now
      });
    }
    sortLyrics();
    persistLocal();
    renderLibrary();
    return Promise.resolve();
  }

  function deleteLyricRecord(id){
    lyrics = lyrics.filter(function(l){ return l.id !== id; });
    persistLocal();
    renderLibrary();
  }

  // ---------------- Rendering: library ----------------
  var libraryListEl = document.getElementById('library-list');
  var searchInput = document.getElementById('search-input');

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------------- Lyrics formatting (chords smaller, lyrics bigger) ----------------
  var CHORD_UNIT = /^[A-G][#b]?(maj7|maj|min7|min|dim7|dim|aug|sus4|sus2|sus|add9|add2|m7|m|°)?[0-9]{0,2}(\/[A-G][#b]?)?$/;
  var META_PREFIXES = ['intro:','intro ','outro:','outro ','capo','ending:','ending ','refrain:','coda:','bridge:','tag:','chorus:','interlude:','v1:','v2:'];

  function isChordLine(line){
    var tokens = line.split(/\s+/).filter(Boolean);
    if (tokens.length === 0) return false;
    for (var i=0;i<tokens.length;i++){
      var tok = tokens[i];
      if (/^x[0-9]+$/i.test(tok)) continue;          // repeat marker, e.g. x2
      if (/^\d+\.$/.test(tok)) continue;              // verse number, e.g. 1.
      var parts = tok.split('-');
      var allMatch = true;
      for (var j=0;j<parts.length;j++){
        var part = parts[j].replace(/^[\(\[]+|[\)\]]+$/g, '');
        if (part === '' || !CHORD_UNIT.test(part)){ allMatch = false; break; }
      }
      if (!allMatch) return false;
    }
    return true;
  }

  function classifyLine(line){
    var trimmed = line.trim();
    if (!trimmed) return 'blank';
    if (/^\[.*\]$/.test(trimmed)) return 'section';
    if (/^\(.*\)$/.test(trimmed)) return 'meta';
    var lower = trimmed.toLowerCase();
    for (var i=0;i<META_PREFIXES.length;i++){
      if (lower.indexOf(META_PREFIXES[i]) === 0) return 'meta';
    }
    if (isChordLine(trimmed)) return 'chord';
    return 'lyric';
  }

  function renderFormattedLyrics(text){
    var raw = (text || '');
    if (!raw.trim()) return '<div class="lyric-empty">No lyrics yet — tap Edit to add them.</div>';
    var lines = raw.split('\n');
    var html = '';
    lines.forEach(function(line){
      var type = classifyLine(line);
      if (type === 'blank'){
        html += '<div class="lyric-line-blank"></div>';
      } else {
        html += '<div class="lyric-line-' + type + '">' + escapeHtml(line) + '</div>';
      }
    });
    return html;
  }

  // ---------------- Viewer overlay (read-only) ----------------
  var viewerOverlay = document.getElementById('viewer-overlay');
  var viewerTitleEl = document.getElementById('viewer-title');
  var viewerMetaEl = document.getElementById('viewer-meta');
  var viewerBodyEl = document.getElementById('viewer-body');
  var viewerEditBtn = document.getElementById('btn-viewer-edit');
  var viewerCloseBtn = document.getElementById('viewer-close');
  var viewingId = null;

  // ---------------- Viewer zoom (buttons, pinch, ctrl+scroll) ----------------
  var VIEWER_ZOOM_KEY = 'songleaf_viewer_zoom';
  var VIEWER_ZOOM_MIN = 0.7;
  var VIEWER_ZOOM_MAX = 2.6;
  var viewerZoomOutBtn = document.getElementById('viewer-zoom-out');
  var viewerZoomInBtn = document.getElementById('viewer-zoom-in');
  var viewerZoomResetBtn = document.getElementById('viewer-zoom-reset');
  var viewerZoomLabel = document.getElementById('viewer-zoom-label');
  var viewerZoom = 1;
  try {
    var storedZoom = parseFloat(localStorage.getItem(VIEWER_ZOOM_KEY));
    if (!isNaN(storedZoom) && storedZoom >= VIEWER_ZOOM_MIN && storedZoom <= VIEWER_ZOOM_MAX) viewerZoom = storedZoom;
  } catch (e) {}

  function clampZoom(z){
    return Math.min(VIEWER_ZOOM_MAX, Math.max(VIEWER_ZOOM_MIN, z));
  }
  function applyViewerZoom(){
    viewerBodyEl.style.setProperty('--vz', viewerZoom);
    if (viewerZoomLabel) viewerZoomLabel.textContent = Math.round(viewerZoom * 100) + '%';
    try { localStorage.setItem(VIEWER_ZOOM_KEY, String(viewerZoom)); } catch (e) {}
  }
  function setViewerZoom(z){
    viewerZoom = clampZoom(z);
    applyViewerZoom();
  }
  if (viewerZoomInBtn) viewerZoomInBtn.addEventListener('click', function(){ setViewerZoom(viewerZoom + 0.1); });
  if (viewerZoomOutBtn) viewerZoomOutBtn.addEventListener('click', function(){ setViewerZoom(viewerZoom - 0.1); });
  if (viewerZoomResetBtn) viewerZoomResetBtn.addEventListener('click', function(){ setViewerZoom(1); });

  // Pinch-to-zoom (touch) on the lyric sheet
  var pinchStartDist = null;
  var pinchStartZoom = 1;
  function touchDist(touches){
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  viewerBodyEl.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){
      pinchStartDist = touchDist(e.touches);
      pinchStartZoom = viewerZoom;
    }
  }, { passive: true });
  viewerBodyEl.addEventListener('touchmove', function(e){
    if (e.touches.length === 2 && pinchStartDist){
      e.preventDefault();
      var newDist = touchDist(e.touches);
      var scale = newDist / pinchStartDist;
      setViewerZoom(pinchStartZoom * scale);
    }
  }, { passive: false });
  viewerBodyEl.addEventListener('touchend', function(e){
    if (e.touches.length < 2) pinchStartDist = null;
  });

  // Ctrl/Cmd + scroll wheel zoom (trackpad pinch on desktop browsers)
  viewerBodyEl.addEventListener('wheel', function(e){
    if (e.ctrlKey || e.metaKey){
      e.preventDefault();
      setViewerZoom(viewerZoom - e.deltaY * 0.01);
    }
  }, { passive: false });

  function openViewer(id){
    var l = lyrics.find(function(x){ return x.id === id; });
    if (!l) return;
    viewingId = id;
    viewerTitleEl.textContent = l.title || 'Untitled';
    var metaBits = [];
    if (l.artist) metaBits.push(l.artist);
    if (l.tag) metaBits.push(l.tag);
    viewerMetaEl.textContent = metaBits.join(' · ');
    viewerBodyEl.innerHTML = renderFormattedLyrics(l.lyrics);
    applyViewerZoom();
    viewerOverlay.classList.remove('hidden');
  }
  function closeViewer(){
    viewerOverlay.classList.add('hidden');
    viewingId = null;
  }
  viewerCloseBtn.addEventListener('click', closeViewer);
  viewerOverlay.addEventListener('click', function(e){ if (e.target === viewerOverlay) closeViewer(); });
  viewerEditBtn.addEventListener('click', function(){
    var id = viewingId;
    closeViewer();
    openEditor(id);
  });

  function renderLibrary(){
    if (typeof maybeShowImportBanner === 'function') maybeShowImportBanner();
    var q = (searchInput.value || '').trim().toLowerCase();
    var filtered = lyrics.filter(function(l){
      if (!q) return true;
      return (l.title||'').toLowerCase().indexOf(q) > -1 ||
             (l.artist||'').toLowerCase().indexOf(q) > -1 ||
             (l.tag||'').toLowerCase().indexOf(q) > -1 ||
             (l.lyrics||'').toLowerCase().indexOf(q) > -1;
    });

    if (lyrics.length === 0){
      libraryListEl.innerHTML =
        '<div class="empty-state">' +
          '<div class="icon">🎼</div>' +
          '<h3>Your songbook is empty</h3>' +
          '<p>Add a lyric by hand, or scan a printed sheet and Songleaf will read it for you.</p>' +
          '<button class="btn-new" id="empty-add-btn">+ Add your first lyric</button>' +
        '</div>';
      var b = document.getElementById('empty-add-btn');
      if (b) b.addEventListener('click', function(){ openEditor(null); });
      return;
    }

    if (filtered.length === 0){
      libraryListEl.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>No matches</h3><p>Try a different search term.</p></div>';
      return;
    }

    libraryListEl.innerHTML = filtered.map(function(l){
      var snippet = (l.lyrics||'').split('\n').find(function(line){ return line.trim().length>0; }) || '';
      return (
        '<div class="lyric-card" data-id="' + l.id + '">' +
          '<div class="row-top">' +
            '<h3>' + (escapeHtml(l.title) || 'Untitled') + '</h3>' +
            (l.tag ? '<span class="tag">' + escapeHtml(l.tag) + '</span>' : '') +
          '</div>' +
          (l.artist ? '<div class="artist">' + escapeHtml(l.artist) + '</div>' : '') +
          (snippet ? '<div class="snippet">' + escapeHtml(snippet) + '</div>' : '') +
        '</div>'
      );
    }).join('');

    Array.prototype.forEach.call(libraryListEl.querySelectorAll('.lyric-card'), function(card){
      card.addEventListener('click', function(){
        openViewer(card.getAttribute('data-id'));
      });
    });
  }

  searchInput.addEventListener('input', renderLibrary);

  // ---------------- Editor overlay ----------------
  var overlay = document.getElementById('editor-overlay');
  var editTitleInput = document.getElementById('edit-title');
  var editArtistInput = document.getElementById('edit-artist');
  var editTagInput = document.getElementById('edit-tag');
  var editLyricsInput = document.getElementById('edit-lyrics');
  var editorHeading = document.getElementById('editor-title');
  var deleteBtn = document.getElementById('btn-delete-lyric');

  function openEditor(id){
    editingId = id;
    if (id){
      var l = lyrics.find(function(x){ return x.id === id; });
      if (!l) return;
      editorHeading.textContent = 'Edit lyric';
      editTitleInput.value = l.title || '';
      editArtistInput.value = l.artist || '';
      editTagInput.value = l.tag || '';
      editLyricsInput.value = l.lyrics || '';
      deleteBtn.style.display = 'inline-block';
    } else {
      editorHeading.textContent = 'New lyric';
      editTitleInput.value = '';
      editArtistInput.value = '';
      editTagInput.value = '';
      editLyricsInput.value = '';
      deleteBtn.style.display = 'none';
    }

    setTimeout(function(){ editTitleInput.focus(); }, 50);

  function closeEditor(){
    overlay.classList.add('hidden');
    editingId = null;
  }

    saveLyricRecord({
      title: title,
      artist: editArtistInput.value.trim(),
      tag: editTagInput.value.trim(),
      lyrics: editLyricsInput.value
    }, editingId);
    showToast('Saved to your songbook');
    closeEditor();

    if (!editingId) return;
    deleteLyricRecord(editingId);
    showToast('Removed');
    closeEditor();

  // ---------------- Tabs ----------------
  var viewLibrary = document.getElementById('view-library');

  function switchTab(tab){
    currentTab = tab;
    if (tab === 'library'){
      viewLibrary.classList.remove('hidden');
      viewScan.classList.add('hidden');
      tabLibrary.classList.add('active');
      tabScan.classList.remove('active');
    } else {
      viewScan.classList.remove('hidden');
      viewLibrary.classList.add('hidden');
      tabScan.classList.add('active');
      tabLibrary.classList.remove('active');
    }
  }
  tabLibrary.addEventListener('click', function(){ switchTab('library'); });
  tabScan.addEventListener('click', function(){ switchTab('scan'); });

  // ---------------- Scan (on-device OCR, no server dependency) ----------------
  var fileCamera = document.getElementById('file-camera');
  var fileUpload = document.getElementById('file-upload');
  var previewWrap = document.getElementById('scan-preview-wrap');
  var previewImg = document.getElementById('scan-preview-img');
  var progressWrap = document.getElementById('scan-progress-wrap');
  var progressBar = document.getElementById('scan-progress-bar');
  var scanStatus = document.getElementById('scan-status');
  var scanErrorEl = document.getElementById('scan-error');
  var scanResult = document.getElementById('scan-result');
  var scanTitleInput = document.getElementById('scan-title');
  var scanArtistInput = document.getElementById('scan-artist');

  function resetScan(){
    previewWrap.style.display = 'none';
    progressWrap.style.display = 'none';
    scanErrorEl.style.display = 'none';
    scanResult.style.display = 'none';
    progressBar.classList.remove('indeterminate');
    progressBar.style.width = '0%';
    fileCamera.value = '';
    fileUpload.value = '';
  }

  function handleFile(file){
    if (!file) return;
    resetScan();
    previewWrap.style.display = 'block';
    var reader = new FileReader();
    reader.onload = function(e){ previewImg.src = e.target.result; };
    reader.readAsDataURL(file);
    runOcr(file);
  }

  fileCamera.addEventListener('change', function(e){ handleFile(e.target.files[0]); });
  fileUpload.addEventListener('change', function(e){ handleFile(e.target.files[0]); });

  function runOcr(file){
    if (typeof Tesseract === 'undefined'){
      scanErrorEl.textContent = "The text reader didn't load — check your connection and try again, or type the lyrics in by hand below.";
      scanErrorEl.style.display = 'block';
      scanResult.style.display = 'block';
      scanTextArea.value = '';
      return;
    }
    progressWrap.style.display = 'block';
    scanStatus.textContent = 'Warming up the reader…';
    progressBar.style.width = '3%';

    Tesseract.recognize(file, 'eng', {
      logger: function(m){
        if (m.status === 'recognizing text' && typeof m.progress === 'number'){
          progressBar.style.width = Math.round(m.progress * 100) + '%';
          scanStatus.textContent = 'Reading the page… ' + Math.round(m.progress * 100) + '%';
        } else if (m.status){
          scanStatus.textContent = m.status.charAt(0).toUpperCase() + m.status.slice(1) + '…';
        }
      }
    }).then(function(result){
      progressWrap.style.display = 'none';
      var text = (result && result.data && result.data.text) ? result.data.text.trim() : '';
      scanResult.style.display = 'block';
      scanTextArea.value = text;
      if (!text){
        scanErrorEl.textContent = "Couldn't find readable text in that photo — try a clearer, well-lit shot, or type the lyrics in below.";
        scanErrorEl.style.display = 'block';
      }
      setTimeout(function(){ scanTitleInput.focus(); }, 50);
    }).catch(function(err){
      console.error(err);
      progressWrap.style.display = 'none';
      scanErrorEl.textContent = "Something went wrong reading that photo. You can type the lyrics in below instead.";
      scanErrorEl.style.display = 'block';
      scanResult.style.display = 'block';
      scanTextArea.value = '';
    });
  }

  document.getElementById('btn-save-scan').addEventListener('click', function(){
    var title = scanTitleInput.value.trim();
    if (!title){ showToast('Give it a title first'); scanTitleInput.focus(); return; }
    saveLyricRecord({
      title: title,
      artist: scanArtistInput.value.trim(),
      tag: '',
      lyrics: scanTextArea.value
    }, null);
    showToast('Saved to your songbook');
    resetScan();
    scanTitleInput.value = '';
    scanArtistInput.value = '';
    switchTab('library');
  });

  document.getElementById('btn-discard-scan').addEventListener('click', function(){
    resetScan();
  });

  var importBanner = document.getElementById('import-banner');
  var btnImportYes = document.getElementById('btn-import-yes');
  var btnImportNo = document.getElementById('btn-import-no');

  var importBannerTitleEl = document.getElementById('import-banner-title');
  var importBannerDescEl = document.getElementById('import-banner-desc');

  var importBannerDismissedThisSession = false;

  function maybeShowImportBanner(){
    if (importBannerDismissedThisSession) { importBanner.classList.add('hidden'); return; }
    var existingTitles = lyrics.map(function(l){ return (l.title||'').trim().toLowerCase(); });
    var missing = SEED_SONGS.filter(function(s){ return existingTitles.indexOf(s.title.toLowerCase()) === -1; });
    if (missing.length === 0){
      importBanner.classList.add('hidden');
      return;
    }
    if (importBannerTitleEl) importBannerTitleEl.textContent = missing.length === 1 ? 'Add included song?' : 'Add included songs?';
    if (importBannerDescEl) importBannerDescEl.textContent = missing.length + (missing.length === 1 ? ' song is' : ' songs are') + ' ready to import.';
    importBanner.classList.remove('hidden');
  }

  function dismissImportBanner(){
    importBannerDismissedThisSession = true;
    importBanner.classList.add('hidden');
  }

  btnImportNo.addEventListener('click', dismissImportBanner);

  btnImportYes.addEventListener('click', function(){
    btnImportYes.disabled = true;
    btnImportYes.textContent = 'Importing…';
    var existingTitles = lyrics.map(function(l){ return (l.title||'').trim().toLowerCase(); });
    var toAdd = SEED_SONGS.filter(function(s){ return existingTitles.indexOf(s.title.toLowerCase()) === -1; });
    var chain = Promise.resolve();
    toAdd.forEach(function(song){
      chain = chain.then(function(){
        return saveLyricRecord({ title: song.title, artist: song.artist, tag: song.tag, lyrics: song.lyrics }, null);
      });
    });
    chain.then(function(){
      showToast('Added ' + toAdd.length + ' songs to your songbook');
      dismissImportBanner();
      switchTab('library');
    });
  });

  // ---------------- Init ----------------
  renderLibrary();
  maybeShowImportBanner();
  initStorage();

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.error('Service worker registration failed', err);
      });
    });
  }
})();
